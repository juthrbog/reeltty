version: "3"

vars:
  # The version in Cargo.toml.
  VERSION:
    sh: cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - "{{.TASK_EXE}} --list"

  # ─── Build ──────────────────────────────────────────────

  build:
    desc: Build the release binary (target/release/reeltty)
    cmds:
      - cargo build --release --locked

  run:
    desc: "Build and run reeltty (usage: task run -- doctor)"
    cmds:
      - cargo run --release --locked -- {{.CLI_ARGS}}

  doctor:
    desc: Check that mpv, yt-dlp and the terminal are in place
    cmds:
      - cargo run --release --locked -- doctor

  # ─── Testing ────────────────────────────────────────────

  test:
    desc: Run all tests (the libmpv tests need mpv)
    cmds:
      - cargo test --locked

  test:live:
    desc: Run the tests that use the network (YouTube, SponsorBlock)
    cmds:
      - cargo test --locked -- --ignored

  snapshots:
    desc: Review changed UI snapshots (needs cargo-insta)
    cmds:
      - cargo insta review

  # ─── Linting ────────────────────────────────────────────

  lint:
    desc: Check the format, clippy (pedantic, as CI), and the release scripts
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets --locked -- -D warnings
      # No -x: following source lines is not needed for these scripts.
      - shellcheck scripts/*.sh

  fmt:
    desc: Format the code
    cmds:
      - cargo fmt

  deny:
    desc: Check advisories, licenses, bans and sources (cargo-deny, as CI)
    cmds:
      - cargo deny check

  vuln:
    desc: Scan for known vulnerabilities (cargo-audit, as CI)
    cmds:
      - cargo audit

  check:
    desc: Run every check that CI runs
    cmds:
      - task: lint
      - task: test
      - task: deny
      - task: vuln

  # ─── Housekeeping ───────────────────────────────────────

  clean:
    desc: Remove build artifacts
    cmds:
      - cargo clean
      - rm -rf dist/ .task/

  # ─── Release ────────────────────────────────────────────

  release:dry-run:
    desc: Build the release archive of this machine, the source archive and the recipes in dist/
    vars:
      PLATFORM:
        sh: |
          case "$(uname -m)" in
            x86_64) echo linux_amd64 ;;
            aarch64) echo linux_arm64 ;;
            *) uname -m ;;
          esac
    cmds:
      - rm -rf dist
      - cargo build --release --locked
      - scripts/archive.sh {{.VERSION}} {{.PLATFORM}} dist
      - git archive --format=tar --prefix=reeltty-{{.VERSION}}/ HEAD | gzip -n > dist/reeltty_{{.VERSION}}_source.tar.gz
      - scripts/formula.sh {{.VERSION}} dist/reeltty_{{.VERSION}}_source.tar.gz > dist/reeltty.rb
      - scripts/pkgbuild.sh {{.VERSION}} dist/reeltty_{{.VERSION}}_source.tar.gz dist
      - ruby -c dist/reeltty.rb
      - bash -n dist/PKGBUILD
      - tar -xzOf dist/reeltty_{{.VERSION}}_{{.PLATFORM}}.tar.gz reeltty > /dev/null
      - ls -l dist

  release:pkgbuild:
    desc: Build the AUR package of this commit with makepkg (Arch Linux), in dist/pkg
    preconditions:
      - sh: command -v makepkg
        msg: "task release:pkgbuild needs makepkg (Arch Linux)."
    cmds:
      - rm -rf dist/pkg
      - mkdir -p dist/pkg
      - git archive --format=tar --prefix=reeltty-{{.VERSION}}/ HEAD | gzip -n > dist/pkg/reeltty_{{.VERSION}}_source.tar.gz
      - scripts/pkgbuild.sh {{.VERSION}} dist/pkg/reeltty_{{.VERSION}}_source.tar.gz dist/pkg
      # makepkg uses this file and does not download the source.
      - cp dist/pkg/reeltty_{{.VERSION}}_source.tar.gz dist/pkg/reeltty-{{.VERSION}}.tar.gz
      # --nodeps: pacman does not know a rustup install in ~/.cargo, so its
      # check for cargo fails although cargo works. The build itself needs
      # cargo, and the tests need mpv.
      - cd dist/pkg && makepkg -f --nodeps
      - cd dist/pkg && makepkg --printsrcinfo | diff - .SRCINFO

  release:
    desc: "Tag and push a new release (usage: task release -- v0.1.0)"
    preconditions:
      - sh: '[[ "{{.CLI_ARGS}}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]'
        msg: "Give a version such as v0.1.0 or v0.1.0-rc.1: task release -- v0.1.0"
      - sh: test "{{.CLI_ARGS}}" = "v{{.VERSION}}"
        msg: "Cargo.toml has version {{.VERSION}}. Change it in a pull request first."
      - sh: test "$(git branch --show-current)" = main
        msg: "Switch to the main branch first."
      - sh: test -z "$(git status --porcelain)"
        msg: "Commit or stash your changes first."
      - sh: git fetch -q origin main && test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
        msg: "Pull first: main is not the same as origin/main."
      - sh: "! git rev-parse -q --verify refs/tags/{{.CLI_ARGS}} > /dev/null"
        msg: "The tag {{.CLI_ARGS}} exists already."
    cmds:
      - git tag -a {{.CLI_ARGS}} -m {{.CLI_ARGS}}
      - git push origin {{.CLI_ARGS}}
