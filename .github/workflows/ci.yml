name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Ubuntu 24.04 has mpv 0.37 (client API 2.2), the oldest that reeltty supports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The tests link to libmpv and play a generated test video.
      - name: Install libmpv
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmpv-dev
      # Keep this version the same as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
        env:
          INSTA_UPDATE: "no"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
