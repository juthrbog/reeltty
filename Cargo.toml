[package]
name = "reeltty"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A keyboard-driven YouTube player that runs in the terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/juthrbog/reeltty"
publish = false

[workspace]
# The spike is a separate throwaway crate.
exclude = ["spike"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
libc = "0.2.191"
# unstable-rendered-line-info: Paragraph::line_count, to stop scrolling at the end.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "gzip", "http2", "json", "rustls-no-provider"] }
# ring as the crypto provider: aws-lc-rs has an OpenSSL-style license.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
unicode-width = "0.2.3"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
insta = "1.49.0"
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Personal tool: these add noise without much value.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Its fix, `assert_eq!(x, [] as [T; 0])`, reads worse than `assert!(x.is_empty())`.
assert_is_empty = "allow"
