# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# Unmaintained direct dependencies fail the check. The cargo audit job
# reports unmaintained transitive dependencies as warnings.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licenses only. No GPL (design decision Q11).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# MPL-2.0 is copyleft for its own files only. directories -> dirs-sys uses it.
exceptions = [{ crate = "option-ext", allow = ["MPL-2.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
